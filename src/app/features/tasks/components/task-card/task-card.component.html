<div class="p-3 bg-[#fafafa] rounded-xl cursor-grab flex flex-col gap-3">
  <div class="flex gap-1">
    <p class="font-bold" [title]="task.name">
      {{ task.name.length < 15 ? task.name : (task.name | slice: 0 : 15) + '...' }}
    </p>
    <img src="images/icon-delete.svg" alt="" class="self-start cursor-pointer ml-auto" (click)="deleteTask()" />
  </div>

  <p class="font-light text-sm" [title]="task.description">
    {{ task.description.length < 25 ? task.description : (task.description | slice: 0 : 25) + '...' }}
  </p>

  <div class="flex items-center gap-1">
    <img src="images/icon-comments.svg" alt="" />
    <p
      class="font-semibold text-xs text-[#2a89ef] underline underline-offset-2 cursor-pointer"
      (click)="openTaskCommentsModal()">
      {{ task.comments.length }} Comentários
    </p>
    <p
      class="font-semibold text-xs text-[#2a89ef] underline underline-offset-2 cursor-pointer ml-auto"
      (click)="openEditTaskModal()">
      Editar
    </p>
  </div>
</div>
