<form class="rounded-xl overflow-hidden bg-white">
  <div class="flex gap-1 items-center p-4">
    <img src="images/icon-new-task.svg" alt="" />
    <h1 class="font-semibold text-lg">
      {{ (_data.mode === 'create' ? 'Criar ' : 'Editar ') + 'tarefa' }}
    </h1>
    <img src="images/icon-close.svg" alt="" class="ml-auto cursor-pointer" />
  </div>

  <div class="p-4 border-y border-[#d1d5db] flex flex-col gap-4">
    <div>
      <p class="font-semibold text-sm mb-2">Nome</p>
      <input
        type="text"
        placeholder="Descreva o que deverá ser feito"
        class="w-full border border-[#d1d5db] p-3 rounded-lg text-sm font-light text-[#89919f]" />
      <p class="font-semibold text-sm text-red-500">O campo é obrigatório e preacisa ter no minímo 10 caracteres.</p>
    </div>

    <div>
      <p class="font-semibold text-sm mb-2">Descrição</p>
      <input
        type="text"
        placeholder="Adicione uma descrição"
        class="w-full border border-[#d1d5db] p-3 rounded-lg text-sm font-light text-[#89919f]" />
      <p class="font-semibold text-sm text-red-500">O campo é obrigatório e preacisa ter no minímo 10 caracteres.</p>
    </div>
  </div>

  <div class="p-4 flex justify-end gap-2">
    <button
      type="button"
      class="py-3 px-4 bg-[#fafafa] rounded-xl text-sm font-semibold cursor-pointer active:translate-y-1 transition-transform duration-75">
      Cancelar
    </button>
    <button
      type="submit"
      class="py-3 px-4 bg-[#2a89ef] text-white rounded-xl text-sm font-semibold cursor-pointer active:translate-y-1 transition-transform duration-75 shadow-md shadow-blue-500/50">
      {{ _data.mode === 'create' ? 'Criar uma tarefa' : 'Salvar alterações' }}
    </button>
  </div>
</form>
